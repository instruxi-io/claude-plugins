name: nightly
# The plugin against the LATEST Claude Code CLI, every night, on a clean hosted runner: a Claude Code release
# that breaks the install, the hooks or the manifests shows up here the day it ships, not on the next PR.
# No credentials: the clean install needs the `claude` CLI but no sign-in or model session, and the worker
# and Grok tests run against stub servers. (It was a self-hosted job that never ran: the org has no runner.)
on:
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: install the latest Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@latest && claude --version
      - name: clean install from nothing
        run: bash test/clean-install.sh
      - name: graph worker hooks against a stub graph server
        working-directory: enforcer
        run: node --test test/graph/run.test.mjs
      - name: Grok install and shim
        working-directory: enforcer
        run: node --test test/grok-install.test.mjs test/grok-shim.test.mjs
