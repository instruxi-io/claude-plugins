name: nightly
# Real-harness smoke on a self-hosted runner: the clean install, a real `claude -p` worker on a fixture graph,
# and the Grok smoke. The result is the run's check.
on:
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: [self-hosted, linux]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: clean install from nothing
        run: bash test/clean-install.sh
      - name: a real claude -p worker on a fixture graph
        run: node --test enforcer/test/graph/run.test.mjs
        env:
          ENFORCER_REAL_CLAUDE: '1'
      - name: Grok smoke
        run: node --test enforcer/test/grok-install.test.mjs enforcer/test/grok-shim.test.mjs
